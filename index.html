<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>스플랫 보기</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f14;color:#e2e8f0;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  #c{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:fixed;left:12px;top:12px;background:rgba(11,15,20,.9);border:1px solid #1e293b;
    border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6;
    max-width:min(360px,calc(100vw - 24px));backdrop-filter:blur(6px)}
  #steps{margin:0;padding:0;list-style:none}
  #steps li{padding:2px 0;color:#64748b}
  #steps li.ok{color:#86efac}
  #steps li.ok::before{content:"OK  ";color:#22c55e;font-weight:700}
  #steps li.bad{color:#fca5a5}
  #steps li.bad::before{content:"X   ";color:#ef4444;font-weight:700}
  #steps li:not(.ok):not(.bad)::before{content:"    "}
  #steps li .fix{display:block;margin:2px 0 4px 22px;color:#fca5a5;font-size:11.5px;white-space:pre-wrap}
  #flip{position:fixed;right:12px;top:12px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;
    border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer}
  #flip:hover{background:#334155}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <ul id="steps">
    <li id="s1">라이브러리 불러오기</li>
    <li id="s2">렌더러 넣기</li>
    <li id="s3">파일 받기</li>
    <li id="s4">알갱이로 풀기</li>
    <li id="s5">크기 재기</li>
  </ul>
  <div id="total" style="margin-top:6px;color:#7dd3fc"></div>
</div>
<button id="flip">위아래 뒤집기</button>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
  "@sparkjsdev/spark":"https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.1.0/dist/spark.module.js"
}}
</script>
<script type="module">
let SPLAT_FILE = "scene.sog";   // 같은 폴더에 둔 파일 이름. 여기만 고치면 된다

const el = id => document.getElementById(id);
function ok(id, text) { const e = el(id); e.className = "ok"; if (text) e.textContent = text; }
function bad(id, label, fix) {
  const e = el(id); e.className = "bad"; e.textContent = label;
  const f = document.createElement("span");
  f.className = "fix"; f.textContent = fix;
  e.appendChild(f);
}

let THREE, OrbitControls, SPARK;
try {
  THREE = await import("three");
  ({ OrbitControls } = await import("three/addons/controls/OrbitControls.js"));
  SPARK = await import("@sparkjsdev/spark");
  ok("s1");
} catch (e) {
  bad("s1", "라이브러리 불러오기",
    "인터넷 연결과 CDN 차단 여부를 보십시오. " + (e?.message ?? String(e)));
  throw e;
}

const canvas = el("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f14);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.01, 1000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

/* Spark 는 전용 렌더러를 장면에 넣어야 그린다.
   이 두 줄을 빼면 알갱이를 다 읽고도 화면이 검은 채로 있고 오류도 안 난다. */
let spark = null;
if (SPARK.SparkRenderer) {
  spark = new SPARK.SparkRenderer({ renderer });
  scene.add(spark);
  ok("s2");
} else {
  bad("s2", "렌더러 넣기",
    "이 판의 Spark 에는 SparkRenderer 가 없습니다. 버전을 확인하십시오.");
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

let buf;
try {
  const t0 = performance.now();
  const res = await fetch(SPLAT_FILE);
  if (!res.ok) throw new Error(`서버가 ${res.status} 를 돌려줬습니다`);
  buf = await res.arrayBuffer();
  const mb = (buf.byteLength / 1048576).toFixed(1);
  const s = ((performance.now() - t0) / 1000).toFixed(1);
  ok("s3", `파일 받기 — ${SPLAT_FILE} · ${mb}MB · ${s}초`);
} catch (e) {
  bad("s3", "파일 받기",
    `"${SPLAT_FILE}" 를 못 받았습니다. ` + (e?.message ?? String(e)) + "\n" +
    "file:// 로 열었으면 브라우저가 막습니다. python3 -m http.server 로 띄우십시오.\n" +
    "이름 철자와 대소문자도 확인하십시오.");
  throw e;
}

/* 확장자와 Spark 안쪽 형식 이름이 다르다. .sog 는 "pcsogszip" 이다.
   확장자를 그대로 넘기면 Invalid file type 으로 걸린다. */
const TYPE_OF = { ply: "ply", spz: "spz", splat: "splat", ksplat: "ksplat",
                  sog: "pcsogszip", rad: "rad" };

let mesh;
try {
  const ext = SPLAT_FILE.split(".").pop().toLowerCase();
  const fileType = TYPE_OF[ext];
  if (!fileType) throw new Error(`Spark 이 모르는 확장자입니다: .${ext}`);
  mesh = new SPARK.SplatMesh({ fileBytes: new Uint8Array(buf), fileType });
  scene.add(mesh);
  await mesh.initialized;
  const n = mesh.packedSplats?.numSplats ?? 0;
  if (!n) throw new Error("알갱이가 0개입니다");
  ok("s4", `알갱이로 풀기 — ${n.toLocaleString("ko-KR")}개`);
} catch (e) {
  bad("s4", "알갱이로 풀기",
    "확장자와 실제 형식이 맞는지 보십시오. " + (e?.message ?? String(e)) + "\n" +
    "점만 든 ply(x,y,z,r,g,b)에는 scale, opacity, rot 열이 없어 여기서 걸립니다.");
  throw e;
}

/* 알갱이 덩어리는 일반 메시가 아니라서 Box3.setFromObject 가 빈 상자를 돌려준다.
   Spark 가 주는 자, getBoundingBox 로 재야 한다. */
function fit() {
  let box = null;
  if (mesh.getBoundingBox) { try { box = mesh.getBoundingBox(true); } catch (e) {} }
  if (!box || box.isEmpty()) {
    bad("s5", "크기 재기",
      "getBoundingBox 가 빈 상자를 돌려줬습니다. 카메라를 손으로 끌어서 찾으십시오.");
    camera.position.set(2, 1, 2); controls.target.set(0, 0, 0);
    return;
  }
  const c = box.getCenter(new THREE.Vector3());
  const radius = box.getSize(new THREE.Vector3()).length() * 0.5;
  controls.target.copy(c);
  camera.position.copy(c).add(new THREE.Vector3(radius * .9, radius * .35, radius * 1.1));
  camera.near = Math.max(radius / 1000, 0.001);
  camera.far = radius * 60;
  camera.updateProjectionMatrix();
  ok("s5", `크기 재기 — 반지름 ${radius.toFixed(2)}`);
  // performance.now() 는 이 페이지를 열기 시작한 시각(navigation start) 기준이라
  // 폰에서 열었을 때 "첫 화면까지" 를 손으로 잴 필요가 없다. 여기 뜬 값을 그대로 적으면 된다.
  const total = (performance.now() / 1000).toFixed(1);
  el("total").textContent = `첫 화면까지 총 ${total}초`;
}
fit();

el("flip").onclick = () => {
  mesh.scale.y *= -1; mesh.scale.z *= -1;
  mesh.updateMatrixWorld(true);
  fit();
};

(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
